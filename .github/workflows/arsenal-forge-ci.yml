name: Arsenal Forge CI

on:
  push:
    branches:
      - arsenal-forge-v0.1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile modules
        run: python -m compileall arsenal_forge tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
